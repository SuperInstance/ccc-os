name: Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 6 * * 1'   # Weekly Monday 06:00 UTC

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # trufflehog needs full history
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-security-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-security-
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit[toml] pip-audit
    - name: Run bandit (SAST)
      run: |
        bandit -r ccc_os/ -f json -o bandit-report.json || true
        bandit -r ccc_os/ -ll  # Fail on medium+ severity, high+ confidence
    - name: Run pip-audit (dependency vulnerabilities)
      run: |
        pip-audit --desc --format=json -o pip-audit-report.json || true
        pip-audit --desc  # Plain output for logs; non-failing
    - name: Run trufflehog (secret scan)
      continue-on-error: true
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD
        extra_args: --debug --only-verified
    - name: Upload bandit report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: bandit-report
        path: bandit-report.json
    - name: Upload pip-audit report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: pip-audit-report
        path: pip-audit-report.json
